# Mosquitto - configuração para o projeto IoT GP2
listener 1883
protocol mqtt
listener 9001
protocol websockets
allow_anonymous true

# Log persistente (ajuste o caminho caso Mosquitto esteja em outro local)
log_dest stdout
log_dest file C:\Program Files\mosquitto\mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_type publish
